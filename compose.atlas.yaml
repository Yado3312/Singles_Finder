services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    env_file:
      - path: ./backend/.env
        format: raw
    environment:
      ADDR: 0.0.0.0:8080
      WEB_DIR: /app/web
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
